name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  PQSIGN_VERSION: v0.1.0
  # sha256 of pqsign-x86_64-unknown-linux-gnu.tar.gz for PQSIGN_VERSION; update both together.
  PQSIGN_SHA256: b7fbb71298efd09fdc2d8b63f306d9c478f5410f9a5ea9ed76bf3f4e2e1613bc
  PQSIGN_SECRET_KEY_PATH: /tmp/pqsign/release.key

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # sign the build provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install syft for SBOM generation
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.3
      - name: Install pqsign
        run: |
          curl -fsSL -o /tmp/pqsign.tar.gz "https://github.com/pscheid92/pqsign/releases/download/${PQSIGN_VERSION}/pqsign-x86_64-unknown-linux-gnu.tar.gz"
          echo "${PQSIGN_SHA256}  /tmp/pqsign.tar.gz" | sha256sum --check
          tar -xzf /tmp/pqsign.tar.gz -C /usr/local/bin pqsign
          chmod +x /usr/local/bin/pqsign
          pqsign version
      - name: Decode pqsign signing key
        run: |
          install -m 700 -d "$(dirname "$PQSIGN_SECRET_KEY_PATH")"
          printf '%s' "$PQSIGN_SECRET_KEY" | base64 -d > "$PQSIGN_SECRET_KEY_PATH"
          chmod 600 "$PQSIGN_SECRET_KEY_PATH"
        env:
          PQSIGN_SECRET_KEY: ${{ secrets.PQSIGN_SECRET_KEY }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          PQSIGN_SECRET_KEY_PATH: ${{ env.PQSIGN_SECRET_KEY_PATH }}
          PQSIGN_PASSWORD: ${{ secrets.PQSIGN_PASSWORD }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - name: Shred pqsign signing key
        if: always()
        run: shred -u "$PQSIGN_SECRET_KEY_PATH" 2>/dev/null || rm -f "$PQSIGN_SECRET_KEY_PATH"
