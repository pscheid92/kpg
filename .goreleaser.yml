version: 2

project_name: kpg

builds:
  - id: kpg
    main: .
    binary: kpg
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/pscheid92/kpg/internal/buildinfo.Version={{ .Version }} -X github.com/pscheid92/kpg/internal/buildinfo.Commit={{ .Commit }} -X github.com/pscheid92/kpg/internal/buildinfo.Date={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: kpg
    ids:
      - kpg
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

signs:
  - id: pqsign-archives
    artifacts: archive
    signature: "${artifact}.pqsig"
    cmd: pqsign
    args:
      - sign
      - "${artifact}"
      - --secret-key
      - "{{ .Env.PQSIGN_SECRET_KEY_PATH }}"
      - --sig-file
      - "${signature}"
      - --trusted-comment
      - "kpg {{ .Version }} release archive"
    stdin: "{{ .Env.PQSIGN_PASSWORD }}"
    output: true
  - id: pqsign-checksums
    artifacts: checksum
    signature: "${artifact}.pqsig"
    cmd: pqsign
    args:
      - sign
      - "${artifact}"
      - --secret-key
      - "{{ .Env.PQSIGN_SECRET_KEY_PATH }}"
      - --sig-file
      - "${signature}"
      - --trusted-comment
      - "kpg {{ .Version }} checksums"
    stdin: "{{ .Env.PQSIGN_PASSWORD }}"
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
