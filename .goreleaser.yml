version: 2

project_name: kpg

builds:
  - id: kpg
    main: .
    binary: kpg
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Commit-based timestamps keep builds reproducible from the same tag.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/pscheid92/kpg/internal/buildinfo.Version={{ .Version }} -X github.com/pscheid92/kpg/internal/buildinfo.Commit={{ .Commit }} -X github.com/pscheid92/kpg/internal/buildinfo.Date={{ .CommitDate }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: kpg
    ids:
      - kpg
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - id: pqsign-archives
    artifacts: archive
    signature: "${artifact}.pqsig"
    cmd: pqsign
    args:
      - sign
      - "${artifact}"
      - --secret-key
      - "{{ .Env.PQSIGN_SECRET_KEY_PATH }}"
      - --sig-file
      - "${signature}"
      - --trusted-comment
      - "kpg {{ .Version }} release archive"
    stdin: "{{ .Env.PQSIGN_PASSWORD }}"
    output: true
  - id: pqsign-checksums
    artifacts: checksum
    signature: "${artifact}.pqsig"
    cmd: pqsign
    args:
      - sign
      - "${artifact}"
      - --secret-key
      - "{{ .Env.PQSIGN_SECRET_KEY_PATH }}"
      - --sig-file
      - "${signature}"
      - --trusted-comment
      - "kpg {{ .Version }} checksums"
    stdin: "{{ .Env.PQSIGN_PASSWORD }}"
    output: true

homebrew_casks:
  - name: kpg
    binaries:
      - kpg
    homepage: https://github.com/pscheid92/kpg
    description: Command-first CLI for connecting to Kubernetes-hosted Postgres databases
    repository:
      owner: pscheid92
      name: homebrew-tap
      branch: main
      # Pushed over SSH with a deploy key that can only write to the tap.
      git:
        url: git@github.com:pscheid92/homebrew-tap.git
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'
    commit_msg_template: "Update kpg to {{ .Version }}"
    # Installs bash, zsh, fish and PowerShell completions; Homebrew runs
    # `kpg completion <shell>` for each, Cobra's convention.
    generate_completions_from_executable:
      executable: kpg
      shell_parameter_format: cobra
    # Without the deploy key the cask is only rendered into dist/, so local
    # snapshots and forks still release.
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}false{{ else }}true{{ end }}'
    # The binaries are not notarized, so the quarantine flag Homebrew sets
    # would make Gatekeeper block them. The flag is cleared in preflight
    # steps, which run right after the archive is unpacked: Homebrew runs the
    # completion generator below before any postflight step, and it executes
    # kpg. GoReleaser's hooks render the deprecated preflight/postflight blocks
    # and cannot render steps yet, hence the custom block. GoReleaser applies
    # its templates to the whole cask, so Homebrew's {{staged_path}} token is
    # escaped.
    custom_block: |
      preflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/kpg"]
        end
      end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
